    <style>
        [hidden] {
            display: none !important;
        }

        body {
            margin: 0;
            padding: 0;
        }

        /* ── Keyboard ───────────────────────────────────────────── */
        #keyboard {
            display: block;
            width: 100%;
            max-width: 480px;
            height: auto;
            margin: 8px auto;
            touch-action: none;
            /* no scrolling / zooming while playing */
            -webkit-user-select: none;
            user-select: none;
        }

        #keyboard text {
            pointer-events: none;
            -webkit-user-select: none;
            user-select: none;
        }

        .key {
            stroke: black;
            stroke-width: 1;
            cursor: pointer;
        }

        .key.white {
            fill: white;
        }

        .key.black {
            fill: black;
        }

        @media (hover: hover) {
            .key.white:hover {
                fill: #9e9e9e;
                stroke: lightblue;
            }

            .key.black:hover {
                fill: #515151;
                stroke: lightblue;
            }
        }

        /* lit while a note is sounding (from mouse, touch, keyboard or MIDI) */
        .key.white.active {
            fill: #9e9e9e;
            stroke: lightblue;
        }

        .key.black.active {
            fill: #515151;
            stroke: lightblue;
        }

        /* ── Slider ─────────────────────────────────────────────── */
        .slidecontainer {
            width: 100%;
        }

        .slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 25px;
            background: #d3d3d3;
            outline: none;
            opacity: 0.7;
            -webkit-transition: .2s;
            transition: opacity .2s;
        }

        .slider:hover {
            opacity: 1;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 25px;
            height: 25px;
            background: #4CAF50;
            cursor: pointer;
        }

        .slider::-moz-range-thumb {
            width: 25px;
            height: 25px;
            background: #4CAF50;
            cursor: pointer;
        }

        /* ── Toggle switch ──────────────────────────────────────── */
        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            -webkit-transition: .4s;
            transition: .4s;
        }

        .toggle:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            -webkit-transition: .4s;
            transition: .4s;
        }

        input:checked+.toggle {
            background-color: #2196F3;
        }

        input:focus-visible+.toggle {
            box-shadow: 0 0 2px 2px #2196F3;
        }

        input:disabled+.toggle {
            opacity: .4;
            cursor: not-allowed;
        }

        input:checked+.toggle:before {
            -webkit-transform: translateX(26px);
            -ms-transform: translateX(26px);
            transform: translateX(26px);
        }

        .toggle.round {
            border-radius: 34px;
        }

        .toggle.round:before {
            border-radius: 50%;
        }

        /* ── Control cards ──────────────────────────────────────── */
        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin: 10px 0;
            /* same white gap above/below as the other card headings */
        }

        .row h3 {
            margin: 0;
            flex: 1;
        }

        .stepper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 8px 0;
        }

        .stepper button {
            width: 75px;
        }

        .stepper h4 {
            flex: 1;
            text-align: center;
            margin: 0;
        }

        .icon-btn {
            border: 0;
            background: transparent;
            cursor: pointer;
            padding: 4px 8px;
        }

        /* ── 3-Column Ad Layout ─────────────────────────────────── */
        .page-wrapper {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
            box-sizing: border-box;
        }

        .center-content {
            flex: 0 0 auto;
            width: 100%;
            max-width: 500px;
            min-width: 0;
            box-sizing: border-box;
            background-color: #EBEBEB;
        }

        .ad-column {
            flex: 0 0 160px;
            width: 160px;
            min-height: 600px;
            display: block;
            overflow: hidden;
        }

        @media (min-width: 1200px) {
            .ad-column {
                flex: 0 0 300px;
                width: 300px;
            }
        }

        .ad-sticky {
            position: sticky;
            top: 10px;
            display: flex;
            justify-content: center;
            padding: 4px 0;
            width: 100%;
        }

        @media (max-width: 820px) {
            .ad-column {
                display: none !important;
            }

            .ad-column .adsbygoogle {
                display: none !important;
            }
        }
    </style>
    <title>Web Harmonium - developed by Rajaraman Iyer</title>

                        </div>
                    </div>
                    <hr>

                    <div class="w3-container w3-card w3-white">
                        <h3 class="w3-blue-gray w3-center">Additional Reeds</h3>
                        <div class="stepper">
                            <button type="button" class="w3-btn w3-grey w3-round" data-step="stack" data-delta="-1"
                                aria-label="Fewer reeds">-</button>

                            <button type="button" class="w3-btn w3-grey w3-round" data-step="stack" data-delta="1"

                    data-ad-client="ca-pub-3758220358268980" data-ad-slot="3724807997" data-ad-format="auto"

    <script>
        /*
         * Web Harmonium
         *
         * Tip: open the page as webharmonium.html?debug to log every MIDI message
         * and note event to the browser console.
         */
        (function () {
            'use strict';

            /* ── Configuration ───────────────────────────────────────── */
            const SAMPLE_URL = 'harmonium-kannan-orig.wav';
            const REVERB_URL = 'reverb.wav';
            const SAMPLE_ROOT_KEY = 62;                 // the sample is a D (MIDI note 62)
            const LOOP_START = 0.5;                     // seconds; the sample loops from here to its end
            const ATTACK = 0.01;                        // seconds, avoids a click on note start
            const RELEASE = 0.08;                       // seconds, avoids a click on note end
            const OCTAVE_OFFSETS = [-36, -24, -12, 0, 12, 24, 36];
            const MAX_OCTAVE = OCTAVE_OFFSETS.length - 1;
            const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

            const DEBUG = new URLSearchParams(location.search).has('debug');
            const log = (...args) => { if (DEBUG) console.log(...args); };
            const $ = id => document.getElementById(id);
            const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

            /* Computer keyboard -> MIDI note (layout positions of a QWERTY keyboard) */
            const KEY_TO_NOTE = {
                's': 53, 'a': 54, '`': 55, '1': 56, 'q': 57, '2': 58, 'w': 59, 'e': 60,
                '4': 61, 'r': 62, '5': 63, 't': 64, 'y': 65, '7': 66, 'u': 67, '8': 68,
                'i': 69, '9': 70, 'o': 71, 'p': 72, '-': 73, '[': 74, '=': 75, ']': 76,
                '\\': 77, "'": 78, ';': 79
            };

            /* Computer keyboard -> swaram text, collected for the console (Enter prints it) */
            const KEY_TO_SWARAM = {
                's': 'Ṃ', 'a': 'Ṃ', '`': 'P\u0323', '1': 'Ḍ', 'q': 'Ḍ', '2': 'Ṇ', 'w': 'Ṇ',
                'e': 'S', '4': 'R', 'r': 'R', '5': 'G', 't': 'G', 'y': 'M', '7': 'M',
                'u': 'P', '8': 'D', 'i': 'D', '9': 'N', 'o': 'N', 'p': 'Ṡ', '-': 'Ṙ',
                '[': 'Ṙ', '=': 'Ġ', ']': 'Ġ', '\\': 'Ṁ', "'": 'Ṁ', ';': 'Ṗ'
            };

            /* On-screen keyboard layout: white notes left to right, black notes with their x position */
            const WHITE_NOTES = [55, 57, 59, 60, 62, 64, 65, 67, 69, 71, 72, 74, 76, 77];
            const BLACK_KEYS = [[56, 14], [58, 35], [61, 77], [63, 98], [66, 140], [68, 161], [70, 182], [73, 224], [75, 245]];

            /* ── Persistent settings ─────────────────────────────────── */
            const store = {
                get(key, fallback) {
                    try {
                        const v = localStorage.getItem('webharmonium.' + key);
                        return v === null ? fallback : v;
                    } catch (e) { return fallback; }
                },
                set(key, value) {
                    try { localStorage.setItem('webharmonium.' + key, String(value)); } catch (e) { /* storage blocked */ }
                }
            };
            const intSetting = (key, lo, hi, dflt) => {
                const n = parseInt(store.get(key, dflt), 10);
                return Number.isFinite(n) ? clamp(n, lo, hi) : dflt;
            };

            const settings = {
                volume: intSetting('volume', 1, 100, 30),
                reverb: store.get('useReverb', 'false') === 'true',
                octave: intSetting('octave', 0, MAX_OCTAVE, 3),
                transpose: intSetting('transpose', -11, 11, 0),
                stack: intSetting('stack', 0, MAX_OCTAVE, 0)
            };
            settings.stack = Math.min(settings.stack, MAX_OCTAVE - settings.octave);

            /* ── State ───────────────────────────────────────────────── */
            let ctx = null;                  // AudioContext
            let master = null;               // master gain
            let reverbSend = null;           // gain feeding the convolver (0 = reverb off)
            let sampleBuffer = null;
            let midiAccess = null;
            let notation = '';

            const activeNotes = new Map();   // MIDI note -> [{src, env}, ...] currently sounding
            const heldKeys = new Map();      // KeyboardEvent.code -> note, so key-up always releases the right note
            const pointerNotes = new Map();  // pointerId -> note (mouse / touch / pen)
            const keyEls = new Map();        // note -> <rect> on the on-screen keyboard

            /* ── Audio engine ────────────────────────────────────────── */
            async function loadAudio() {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) throw new Error('This browser does not support the Web Audio API.');

                if (ctx) { try { ctx.close(); } catch (e) { /* ignore */ } }
                ctx = new AC();             // created inside the click handler, so it is allowed to run
                if (ctx.state === 'suspended') ctx.resume().catch(() => { });

                master = ctx.createGain();
                master.gain.value = settings.volume / 100;
                master.connect(ctx.destination);

                reverbSend = ctx.createGain();
                reverbSend.gain.value = settings.reverb ? 1 : 0;
                master.connect(reverbSend);

                const fetchBuffer = async url => {
                    const res = await fetch(url);
                    if (!res.ok) throw new Error(url + ': HTTP ' + res.status);
                    return ctx.decodeAudioData(await res.arrayBuffer());
                };

                // reverb is optional: if it fails the rest still works
                fetchBuffer(REVERB_URL).then(buf => {
                    const convolver = ctx.createConvolver();
                    convolver.buffer = buf;
                    reverbSend.connect(convolver);
                    convolver.connect(ctx.destination);
                }).catch(err => {
                    console.warn('Reverb unavailable:', err);
                    $('useReverb').disabled = true;
                    $('useReverb').title = 'Reverb sound file could not be loaded';
                });

                sampleBuffer = await fetchBuffer(SAMPLE_URL);
            }

            function startVoice(index) {
                const t = ctx.currentTime;
                const src = ctx.createBufferSource();
                src.buffer = sampleBuffer;
                src.loop = true;
                src.loopStart = LOOP_START;
                src.detune.value = (index - SAMPLE_ROOT_KEY + settings.transpose) * 100;

                const env = ctx.createGain();
                env.gain.setValueAtTime(0, t);
                env.gain.linearRampToValueAtTime(1, t + ATTACK);

                src.connect(env);
                env.connect(master);
                src.start(t);
                return { src, env };
            }

            function stopVoice(voice) {
                const t = ctx.currentTime;
                const g = voice.env.gain;
                g.cancelScheduledValues(t);
                g.setValueAtTime(g.value, t);
                g.setTargetAtTime(0, t, RELEASE / 4);
                voice.src.onended = () => {
                    voice.src.disconnect();
                    voice.env.disconnect();
                };
                voice.src.stop(t + RELEASE + 0.05);
            }

            function noteOn(note) {
                if (!ctx || !sampleBuffer || activeNotes.has(note)) return;
                if (ctx.state !== 'running') ctx.resume().catch(() => { });

                const voices = [];
                for (let reed = 0; reed <= settings.stack; reed++) {
                    const octaveIndex = settings.octave + reed;
                    if (octaveIndex > MAX_OCTAVE) break;
                    const index = note + OCTAVE_OFFSETS[octaveIndex];
                    if (index < 0 || index > 127) continue;
                    voices.push(startVoice(index));
                }
                activeNotes.set(note, voices);
                setKeyActive(note, true);
                log('noteOn', note, 'voices', voices.length);
            }

            function noteOff(note) {
                const voices = activeNotes.get(note);
                if (!voices) return;
                activeNotes.delete(note);
                voices.forEach(stopVoice);
                setKeyActive(note, false);
                log('noteOff', note);
            }

            function allNotesOff() {
                Array.from(activeNotes.keys()).forEach(noteOff);
                heldKeys.clear();
                pointerNotes.clear();
            }

            /* ── On-screen keyboard ──────────────────────────────────── */
            function setKeyActive(note, on) {
                const el = keyEls.get(note);
                if (el) el.classList.toggle('active', on);
            }

            function buildKeyboard() {
                const svg = $('keyboard');
                const NS = 'http://www.w3.org/2000/svg';
                const make = (tag, attrs, text) => {
                    const n = document.createElementNS(NS, tag);
                    for (const k in attrs) n.setAttribute(k, attrs[k]);
                    if (text !== undefined) n.textContent = text;
                    return n;
                };
                const W = 21, BW = 14;
                const noteToKey = {};
                for (const k in KEY_TO_NOTE) noteToKey[KEY_TO_NOTE[k]] = k;

                const whiteLayer = make('g', {});
                const blackLayer = make('g', {});
                const labelLayer = make('g', {});

                WHITE_NOTES.forEach((note, i) => {
                    const rect = make('rect', { x: i * W, y: 0, width: W, height: 100, 'class': 'key white', 'data-note': note });
                    keyEls.set(note, rect);
                    whiteLayer.appendChild(rect);

                    const cx = i * W + W / 2;
                    labelLayer.appendChild(make('text', {
                        x: cx, y: 65, 'text-anchor': 'middle', fill: 'black',
                        'font-family': 'Courier New, monospace', 'font-size': 14
                    }, noteToKey[note]));
                    const middle = note >= 60 && note <= 71;
                    labelLayer.appendChild(make('text', {
                        x: cx, y: 90, 'text-anchor': 'middle', fill: middle ? 'blue' : '#777',
                        'font-family': 'Courier New, monospace', 'font-size': 14,
                        'font-weight': middle ? 'bold' : 'normal'
                    }, NOTE_NAMES[note % 12]));
                });

                BLACK_KEYS.forEach(([note, x]) => {
                    const rect = make('rect', { x: x, y: 0, width: BW, height: 50, 'class': 'key black', 'data-note': note });
                    keyEls.set(note, rect);
                    blackLayer.appendChild(rect);
                    labelLayer.appendChild(make('text', {
                        x: x + BW / 2, y: 30, 'text-anchor': 'middle', fill: 'white',
                        'font-family': 'Courier New, monospace', 'font-size': 14
                    }, noteToKey[note]));
                });

                svg.appendChild(whiteLayer);
                svg.appendChild(blackLayer);
                svg.appendChild(labelLayer);

                // Pointer events cover mouse, touch and pen, with multi-touch and sliding between keys
                const noteAt = (x, y) => {
                    const el = document.elementFromPoint(x, y);
                    const n = el && el.dataset ? el.dataset.note : undefined;
                    return n === undefined ? null : Number(n);
                };

                svg.addEventListener('pointerdown', e => {
                    if (e.pointerType === 'mouse' && e.button !== 0) return;
                    e.preventDefault();
                    if (!sampleBuffer) return;
                    try { svg.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
                    const note = noteAt(e.clientX, e.clientY);
                    pointerNotes.set(e.pointerId, note);
                    if (note !== null) noteOn(note);
                });

                svg.addEventListener('pointermove', e => {
                    if (!pointerNotes.has(e.pointerId)) return;
                    const prev = pointerNotes.get(e.pointerId);
                    const note = noteAt(e.clientX, e.clientY);
                    if (note === prev) return;
                    if (prev !== null) noteOff(prev);
                    if (note !== null) noteOn(note);
                    pointerNotes.set(e.pointerId, note);
                });

                const release = e => {
                    if (!pointerNotes.has(e.pointerId)) return;
                    const note = pointerNotes.get(e.pointerId);
                    pointerNotes.delete(e.pointerId);
                    if (note !== null) noteOff(note);
                };
                svg.addEventListener('pointerup', release);
                svg.addEventListener('pointercancel', release);
                svg.addEventListener('lostpointercapture', release);
            }

            /* ── Computer keyboard ───────────────────────────────────── */
            const normKey = key => (key.length === 1 ? key.toLowerCase() : key);

            window.addEventListener('keydown', e => {
                if (!sampleBuffer || e.ctrlKey || e.metaKey || e.altKey) return;
                const note = KEY_TO_NOTE[normKey(e.key)];
                if (note === undefined) return;
                e.preventDefault();         // also stops type-ahead in a focused dropdown
                if (e.repeat || heldKeys.has(e.code)) return;
                heldKeys.set(e.code, note);
                noteOn(note);
            });

            window.addEventListener('keyup', e => {
                // Release by physical key, so holding Shift between press and release cannot leave a note stuck
                if (heldKeys.has(e.code)) {
                    const note = heldKeys.get(e.code);
                    heldKeys.delete(e.code);
                    noteOff(note);
                }
                collectNotation(e);
            });

            function collectNotation(e) {
                if (e.ctrlKey || e.metaKey || e.altKey) return;
                const key = normKey(e.key);
                if (key === 'Backspace') {
                    notation = Array.from(notation).slice(0, -1).join('');
                } else if (key === 'Delete') {
                    notation = '';
                } else if (key === 'Enter') {
                    if (notation) console.log(notation);
                    notation = '';
                } else if (key === 'Tab') {
                    notation += ',';
                } else if (KEY_TO_SWARAM[key] !== undefined) {
                    notation += KEY_TO_SWARAM[key];
                }
            }

            // Never leave notes ringing when the page loses focus
            window.addEventListener('blur', allNotesOff);
            document.addEventListener('visibilitychange', () => { if (document.hidden) allNotesOff(); });

            /* ── MIDI ────────────────────────────────────────────────── */
            const setMidiStatus = text => { $('midiStatus').textContent = text; };

            async function initMIDI() {
                if (!navigator.requestMIDIAccess) {
                    setMidiStatus('Web MIDI is not supported in this browser. Try Chrome or Edge.');
                    return;
                }
                setMidiStatus('Requesting MIDI access…');
                try {
                    midiAccess = await navigator.requestMIDIAccess();
                } catch (err) {
                    midiAccess = null;
                    setMidiStatus('MIDI access was refused (' + (err.message || err.name) +
                        '). Allow MIDI for this site using the permission icon in the address bar, then press refresh.');
                    return;
                }
                midiAccess.onstatechange = refreshMidiInputs;   // plug / unplug while the page is open
                refreshMidiInputs();
            }

            let refreshing = false, refreshAgain = false;
            async function refreshMidiInputs() {
                if (!midiAccess) { initMIDI(); return; }
                if (refreshing) { refreshAgain = true; return; }
                refreshing = true;
                try {
                    do {
                        refreshAgain = false;
                        await rebuildMidiInputList();
                    } while (refreshAgain);
                } finally {
                    refreshing = false;
                }
            }

            async function rebuildMidiInputList() {
                const select = $('midiInputDevices');
                const previous = select.value;
                const names = [];
                const problems = [];
                const options = [new Option('All inputs', 'all')];

                for (const input of midiAccess.inputs.values()) {
                    if (input.state === 'disconnected') continue;
                    const label = input.name + (input.manufacturer ? ' by ' + input.manufacturer : '');
                    options.push(new Option(label, input.id));
                    names.push(input.name);
                    input.onmidimessage = onMIDIMessage;
                    try {
                        await input.open();     // fails if another program already owns the port
                    } catch (err) {
                        problems.push(input.name);
                        console.warn('Could not open MIDI input', input.name, err);
                    }
                }

                select.length = 0;
                options.forEach(o => select.add(o));
                select.value = options.some(o => o.value === previous) ? previous : 'all';

                if (!names.length) {
                    setMidiStatus('No MIDI keyboard found. Plug it in, then press refresh.');
                } else if (problems.length) {
                    setMidiStatus('Found ' + names.join(', ') + ', but could not open ' + problems.join(', ') +
                        '. Another program or browser tab may be using it: close it, then press refresh.');
                } else {
                    setMidiStatus('MIDI ready: ' + names.join(', '));
                }
            }

            const MIDI_TYPE_NAMES = {
                0x80: 'Note Off', 0x90: 'Note On', 0xA0: 'Aftertouch', 0xB0: 'Control Change',
                0xC0: 'Program Change', 0xD0: 'Pressure', 0xE0: 'Pitch Bend'
            };

            function onMIDIMessage(event) {
                const selected = $('midiInputDevices').value;
                if (selected && selected !== 'all' && event.target.id !== selected) return;

                const data = event.data;
                const statusByte = data[0];
                if (statusByte >= 0xF0) return;                 // clock, active sensing and other system messages
                const type = statusByte & 0xF0;                 // strip the channel so every channel works
                const channel = (statusByte & 0x0F) + 1;
                const data1 = data.length > 1 ? data[1] : 0;
                const data2 = data.length > 2 ? data[2] : 0;
                log('MIDI', MIDI_TYPE_NAMES[type] || type, 'ch', channel, data1, data2);

                $('midiActivity').textContent = 'Last MIDI message: ' + (MIDI_TYPE_NAMES[type] || ('0x' + type.toString(16))) +
                    ' · channel ' + channel + ' · ' + data1 + (data.length > 2 ? ' · ' + data2 : '');

                switch (type) {
                    case 0x90:
                        if (data2 > 0) noteOn(data1); else noteOff(data1);   // note-on with velocity 0 means note-off
                        break;
                    case 0x80:
                        noteOff(data1);
                        break;
                    case 0xB0:
                        if (data1 === 7) {                      // volume
                            setVolume(Math.max(1, Math.round((100 * data2) / 127)));
                        } else if (data1 === 120 || data1 === 123) {   // all sound off / all notes off
                            allNotesOff();
                        }
                        break;
                }
            }

            /* ── Controls ────────────────────────────────────────────── */
            function render() {
                $('octave').textContent = settings.octave;
                $('stack').textContent = settings.stack;
                $('transpose').textContent = settings.transpose;
                $('rootNote').textContent = NOTE_NAMES[(settings.transpose + 12) % 12];
                $('myRange').value = settings.volume;
                $('volumeLevel').textContent = settings.volume + '%';
                $('useReverb').checked = settings.reverb;
            }

            function setVolume(v) {
                settings.volume = clamp(v, 1, 100);
                store.set('volume', settings.volume);
                if (master) master.gain.setTargetAtTime(settings.volume / 100, ctx.currentTime, 0.01);
                render();
            }

            function shiftOctave(delta) {
                settings.octave = clamp(settings.octave + delta, 0, MAX_OCTAVE);
                settings.stack = Math.min(settings.stack, MAX_OCTAVE - settings.octave);
                store.set('octave', settings.octave);
                store.set('stack', settings.stack);
                render();
            }

            function changeStack(delta) {
                settings.stack = clamp(settings.stack + delta, 0, MAX_OCTAVE - settings.octave);
                store.set('stack', settings.stack);
                render();
            }

            function shiftSemitone(delta) {
                settings.transpose = clamp(settings.transpose + delta, -11, 11);
                store.set('transpose', settings.transpose);
                render();
            }

            function wireControls() {
                const actions = { octave: shiftOctave, stack: changeStack, transpose: shiftSemitone };
                document.querySelectorAll('[data-step]').forEach(btn => {
                    btn.addEventListener('click', () => actions[btn.dataset.step](Number(btn.dataset.delta)));
                });

                $('myRange').addEventListener('input', e => setVolume(Number(e.target.value)));

                $('useReverb').addEventListener('change', e => {
                    settings.reverb = e.target.checked;
                    store.set('useReverb', settings.reverb);
                    if (reverbSend) reverbSend.gain.value = settings.reverb ? 1 : 0;
                });

                $('midiRefresh').addEventListener('click', refreshMidiInputs);
                // hand the keyboard back to the instrument after choosing a device
                $('midiInputDevices').addEventListener('change', e => e.target.blur());
            }

            /* ── Start-up ────────────────────────────────────────────── */
            $('loadBtn').addEventListener('click', async () => {
                const btn = $('loadBtn');
                const msg = $('loadMsg');
                btn.disabled = true;
                msg.textContent = 'Loading…';
                try {
                    await loadAudio();
                } catch (err) {
                    console.error(err);
                    msg.textContent = 'Could not load the harmonium sound (' + err.message + '). Please try again.';
                    btn.disabled = false;
                    return;
                }
                $('load').hidden = true;
                $('mainScreen').hidden = false;
                initMIDI();
            });

            buildKeyboard();
            wireControls();
            render();

            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('/serviceworker.js').then(reg => {
                        reg.onupdatefound = () => {
                            const installing = reg.installing;
                            if (!installing) return;
                            installing.onstatechange = () => {
                                // reload to pick up the new version, but never in the middle of playing
                                if (installing.state === 'installed' && navigator.serviceWorker.controller &&
                                    activeNotes.size === 0) {
                                    window.location.reload();
                                }
                            };
                        };
                    }).catch(err => console.warn('Service worker registration failed:', err));
                });
            }
        })();
    </script>

    <script>
        // Request ads only for columns that are actually visible
        document.querySelectorAll('.ad-column').forEach(function (col) {
            if (window.getComputedStyle(col).display !== 'none') {
                try { (window.adsbygoogle = window.adsbygoogle || []).push({}); } catch (e) { /* ad blocked */ }
            }
        });
    </script>
</body>

</html>
